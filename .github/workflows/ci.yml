name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q kage tests

      # Only real errors (syntax, undefined names, redefinitions): upstream code has style debt.
      # F401 is off because version.py and utils re-export on purpose; F403/F405 are the
      # intentional star imports in kage/utils/__init__.py.
      - name: Ruff
        run: ruff check --select F,E9 --ignore F401,F403,F405 --output-format github kage tests

      - name: Tests
        run: python -m pytest
