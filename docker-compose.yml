services:
  kage:
    # Prebuilt image from GitHub; to build from this checkout instead, run: docker compose up -d --build
    image: ghcr.io/gerdaroot/kage:latest
    build:
      context: .
    container_name: kage
    volumes:
      - kage-data:/data
    stop_signal: SIGINT
    restart: unless-stopped
    stdin_open: true
    tty: true
    init: true

volumes:
  kage-data:
